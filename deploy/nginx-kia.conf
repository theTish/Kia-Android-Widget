# kia.tishman.ca -> the Kia API container on 127.0.0.1:5000
#
# Two things here are inherited from benchbot.conf and are not style choices:
#
#  1. :443 binds 10.0.0.84 explicitly, never the wildcard. tailscaled already
#     holds 100.78.17.30:443, and a 0.0.0.0 bind collides with it - nginx then
#     fails to start TLS while `nginx -t` still passes. If the instance's
#     private IP changes, this line changes with it.
#  2. nginx is 1.20 here, so http2 goes inside the listen directive rather than
#     the 1.25+ `http2 on;` form.
server {
    listen 80;
    server_name kia.tishman.ca;

    # Keep certbot's HTTP-01 challenge working on renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 10.0.0.84:443 ssl http2;
    server_name kia.tishman.ca;

    ssl_certificate     /etc/letsencrypt/live/kia.tishman.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kia.tishman.ca/privkey.pem;

    # A cold car can take well over a minute to answer a command. The Android
    # clients already wait 45s, and gunicorn is set to 120s, so nginx must not
    # be the first thing to give up - that is what produced the 504s on Vercel.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

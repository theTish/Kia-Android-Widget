<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #16181c; font-family: 'Roboto', system-ui, sans-serif; }
    a { color: #7fb3ff; } a:hover { color: #a8ccff; }
  </style>
</helmet>

<!-- Lock is the action you take ninety per cent of the time, so it gets a
     target you can hit without looking. The other two are deliberately
     smaller and lower. -->
<div style="width: 450px; height: 450px; border-radius: 50%; background: #000000; overflow: hidden; position: relative;">

  <div style="position: absolute; left: 0; right: 0; top: 52px; text-align: center; color: #b0bec5; font-size: 24px;">Ready</div>

  <div style="position: absolute; left: 140px; top: 95px; width: 170px; height: 170px; border-radius: 50%; background: #2e7d32; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
    <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="10" width="16" height="11" rx="2.5"></rect>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
    </svg>
    <div style="color: #ffffff; font-size: 26px; font-weight: 500;">Lock</div>
  </div>

  <div style="position: absolute; left: 102px; top: 282px; width: 96px; height: 96px; border-radius: 50%; background: #37474f; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="10" width="16" height="11" rx="2.5"></rect>
      <path d="M8 10V7a4 4 0 0 1 7.5-2"></path>
    </svg>
    <div style="color: #cfd8dc; font-size: 16px; font-weight: 500;">Unlock</div>
  </div>

  <div style="position: absolute; left: 252px; top: 282px; width: 96px; height: 96px; border-radius: 50%; background: #1565c0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20c0-4 2-6 8-6s8 2 8 6"></path>
      <path d="M8 11c1-1.2 1-2.3 0-3.5s-1-2.3 0-3.5"></path>
      <path d="M12 11c1-1.2 1-2.3 0-3.5s-1-2.3 0-3.5"></path>
      <path d="M16 11c1-1.2 1-2.3 0-3.5s-1-2.3 0-3.5"></path>
    </svg>
    <div style="color: #cfd8dc; font-size: 16px; font-weight: 500;">Climate</div>
  </div>

</div>
</x-dc>
</body>
</html>

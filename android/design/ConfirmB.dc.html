<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #16181c; font-family: 'Roboto', system-ui, sans-serif; }
    a { color: #7fb3ff; } a:hover { color: #a8ccff; }
  </style>
</helmet>

<!-- Same geometry as Main, ten seconds after the first Unlock tap. Lock and
     Climate recede so exactly one target is live. -->
<div style="width: 450px; height: 450px; border-radius: 50%; background: #000000; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;">

  <div style="color: #ffb74d; font-size: 24px; font-weight: 500;">Tap again to unlock</div>

  <div style="height: 16px;"></div>

  <div style="display: flex; gap: 40px;">

    <div style="width: 124px; height: 124px; border-radius: 62px; background: #1f2a2f; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#6d7b82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="11" rx="2.5"></rect>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
      </svg>
      <div style="color: #6d7b82; font-size: 22px; font-weight: 500;">Lock</div>
    </div>

    <div style="width: 124px; height: 124px; border-radius: 62px; background: #b4560a; box-shadow: 0 0 0 6px #ffb74d; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="11" rx="2.5"></rect>
        <path d="M8 10V7a4 4 0 0 1 7.5-2"></path>
      </svg>
      <div style="color: #ffffff; font-size: 22px; font-weight: 700;">Confirm</div>
    </div>

  </div>

  <div style="height: 28px;"></div>

  <div style="width: 260px; height: 96px; background: #10243a; border-radius: 48px; display: flex; align-items: center; justify-content: center; gap: 16px;">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#5d7a99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20c0-4 2-6 8-6s8 2 8 6"></path>
      <path d="M8 11c1-1.2 1-2.3 0-3.5s-1-2.3 0-3.5"></path>
      <path d="M12 11c1-1.2 1-2.3 0-3.5s-1-2.3 0-3.5"></path>
      <path d="M16 11c1-1.2 1-2.3 0-3.5s-1-2.3 0-3.5"></path>
    </svg>
    <div style="color: #5d7a99; font-size: 28px; font-weight: 500;">Climate</div>
  </div>

</div>
</x-dc>
</body>
</html>

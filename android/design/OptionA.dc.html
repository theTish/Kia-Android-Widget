<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #16181c; font-family: 'Roboto', system-ui, sans-serif; }
    a { color: #7fb3ff; } a:hover { color: #a8ccff; }
  </style>
</helmet>

<!-- 44mm watch face: 450px = 225dp at 2x. The dashed ring is a 40mm watch
     (99dp radius = 198px) drawn at the same dp scale, so anything crossing
     it is clipped on the smaller watch. -->
<div style="width: 450px; height: 450px; border-radius: 50%; background: #000000; overflow: hidden; position: relative; display: flex; flex-direction: column; align-items: center;">

  <div style="margin-top: 68px; color: #b0bec5; font-size: 26px;">Ready</div>

  <div style="margin-top: 12px; width: 300px; height: 84px; border-radius: 42px; background: #2e7d32; display: flex; align-items: center; justify-content: center;">
    <div style="color: #ffffff; font-size: 30px; font-weight: 500;">Lock</div>
  </div>

  <div style="margin-top: 12px; width: 300px; height: 84px; border-radius: 42px; background: #37474f; display: flex; align-items: center; justify-content: center;">
    <div style="color: #ffffff; font-size: 30px; font-weight: 500;">Unlock</div>
  </div>

  <div style="margin-top: 12px; width: 300px; height: 84px; border-radius: 42px; background: #1565c0; display: flex; align-items: center; justify-content: center;">
    <div style="color: #ffffff; font-size: 30px; font-weight: 500;">Climate</div>
  </div>

  <!-- 40mm bezel overlay -->
  <div style="position: absolute; box-sizing: border-box; left: 27px; top: 27px; width: 396px; height: 396px; border-radius: 50%; border: 2px dashed #ff5252; pointer-events: none;"></div>

  <!-- the area a 40mm watch cannot show, tinted -->
  <div style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, rgba(255,82,82,0) 0 198px, rgba(255,82,82,0.42) 198px 225px);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; color: #ff8a80; font-size: 17px; font-weight: 500; letter-spacing: 0.3px;">corners graze on 40&nbsp;mm</div>

</div>
</x-dc>
</body>
</html>

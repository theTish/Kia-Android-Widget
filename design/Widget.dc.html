<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EV6 GT — Home screen widget</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:Manrope,'Segoe UI',system-ui,sans-serif;color:#F3F5F0}
a{color:#CEDE27}a:hover{color:#DDE868}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 440px; height: 280px; box-sizing: border-box; background: {{wall}}; display: flex; align-items: center; justify-content: center; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; color: #F3F5F0;">
<div style="position: relative; overflow: hidden; width: 376px; box-sizing: border-box; padding: 16px; border-radius: 28px; background: {{cardBg}}; border: {{cardBorder}}; box-shadow: {{cardShadow}}; display: flex; flex-direction: column; gap: 14px; text-shadow: {{ts}};">
<sc-if value="{{glass}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="position: absolute; left: -40px; top: -120px; width: 300px; height: 190px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,0.22), rgba(255,255,255,0)); pointer-events: none;"></div>
</sc-if>
<div style="position: relative; display: flex; align-items: center; gap: 12px;">
<img src="../design-assets/ev6gt-front34.png" alt="White 2024 Kia EV6 GT" style="width: 168px; height: auto; margin-left: -6px;">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; align-items: center; gap: 6px;">
<div style="display: flex; align-items: baseline; font-family: 'Chakra Petch', 'Segoe UI', sans-serif; line-height: 1;"><span style="font-size: 44px; font-weight: 600;">{{s.pct}}</span><span style="font-size: 20px; font-weight: 600; color: {{dim}};">%</span></div>
<sc-if value="{{charging}}" hint-placeholder-val="{{ false }}">
<svg aria-label="Charging" width="22" height="22" viewBox="0 0 24 24" fill="#CEDE27" stroke="#CEDE27" stroke-width="1.5" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>
</sc-if>
<sc-if value="{{plugged}}" hint-placeholder-val="{{ false }}">
<svg aria-label="Plugged in" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F3F5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v5M15 3v5"></path><path d="M6 8h12v3a6 6 0 0 1-12 0z"></path><path d="M12 17v4"></path></svg>
</sc-if>
</div>
<div style="font-size: 13px; color: {{dim}};"><span style="color: #F3F5F0; font-weight: 600;">{{s.range}} km</span> · Locked</div>
<sc-if value="{{charging}}" hint-placeholder-val="{{ false }}">
<div style="font-size: 13px; font-weight: 600; color: #CEDE27;">Charging · 1 h 05 m left</div>
</sc-if>
<sc-if value="{{plugged}}" hint-placeholder-val="{{ false }}">
<div style="font-size: 13px; font-weight: 600; color: #F3F5F0;">Plugged in · not charging</div>
</sc-if>
<div style="position: relative; height: 4px; margin-top: 6px; border-radius: 2px; background: {{track}};"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{s.width}}; border-radius: 2px; background: #CEDE27;"></div><div style="position: absolute; left: 80%; top: -3px; bottom: -3px; width: 2px; border-radius: 1px; background: rgba(255,255,255,0.85);"></div></div>
</div>
</div>
<div style="position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
<button aria-label="Lock" style="height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; border: {{btnBorder}}; background: {{btnBg}}; color: #F3F5F0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></button>
<button aria-label="Unlock" style="height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; border: {{btnBorder}}; background: {{btnBg}}; color: #F3F5F0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.5-2"></path></svg></button>
<button aria-label="Climate" style="height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; border: {{btnBorder}}; background: {{btnBg}}; color: #F3F5F0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3"></path><path d="M3 12h16a3 3 0 1 1-3 3"></path><path d="M3 16h7"></path></svg></button>
<button aria-label="Refresh" style="height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; border: {{btnBorder}}; background: {{btnBg}}; color: #F3F5F0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"charge":{"editor":"enum","options":["Unplugged","Charging","Plugged in"],"default":"Unplugged"},"background":{"editor":"enum","options":["Glass","Solid"],"default":"Glass"},"wallpaper":{"editor":"enum","options":["Dusk","Daylight","Dark"],"default":"Dusk"},"$preview":{"width":440,"height":280}}'>
class Component extends DCLogic {
  renderVals() {
    const glass = (this.props.background ?? 'Glass') === 'Glass';
    const charge = this.props.charge ?? 'Unplugged';
    const samples = {
      Unplugged: { pct: 78, range: 412, width: '78%' },
      Charging: { pct: 64, range: 338, width: '64%' },
      'Plugged in': { pct: 80, range: 423, width: '80%' }
    };
    const walls = {
      Dusk: 'radial-gradient(circle at 18% 20%, #FF7A59 0, rgba(255,122,89,0) 42%), radial-gradient(circle at 85% 30%, #7B5CFF 0, rgba(123,92,255,0) 45%), radial-gradient(circle at 60% 95%, #1FB6C9 0, rgba(31,182,201,0) 50%), #1A1F3A',
      Daylight: 'radial-gradient(circle at 20% 25%, #FFD6A5 0, rgba(255,214,165,0) 45%), radial-gradient(circle at 80% 20%, #9ED8FF 0, rgba(158,216,255,0) 50%), radial-gradient(circle at 55% 100%, #C8F0D8 0, rgba(200,240,216,0) 55%), #E9EEF5',
      Dark: 'linear-gradient(160deg, #2B3238, #14181B)'
    };
    return {
      glass,
      charging: charge === 'Charging',
      plugged: charge === 'Plugged in',
      s: samples[charge] ?? samples.Unplugged,
      wall: walls[this.props.wallpaper ?? 'Dusk'] ?? walls.Dusk,
      cardBg: glass ? 'linear-gradient(145deg, rgba(255,255,255,0.20), rgba(255,255,255,0.05) 45%, rgba(255,255,255,0.10)), rgba(12,14,20,0.34)' : '#0B0D0F',
      cardBorder: glass ? '1px solid rgba(255,255,255,0.28)' : '1px solid rgba(0,0,0,0)',
      cardShadow: glass ? 'inset 0 1px 0 rgba(255,255,255,0.50), inset 0 -1px 0 rgba(255,255,255,0.10), 0 18px 40px rgba(0,0,0,0.30)' : '0 12px 32px rgba(0,0,0,0.45)',
      ts: glass ? '0 1px 2px rgba(0,0,0,0.30)' : 'none',
      dim: glass ? 'rgba(255,255,255,0.80)' : '#A3ABB0',
      track: glass ? 'rgba(255,255,255,0.20)' : '#1E2327',
      btnBg: glass ? 'rgba(255,255,255,0.14)' : '#15191C',
      btnBorder: glass ? '1px solid rgba(255,255,255,0.24)' : '1px solid #262B30'
    };
  }
}
</script>
</body>
</html>
